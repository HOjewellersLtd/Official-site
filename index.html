<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>H.O. Jewellers</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Georgia, "Times New Roman", serif;
}

body{
    cursor:none;
}

/* =========================
   MAIN CINEMATIC SCREEN
========================= */

#intro{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            #17130a 0%,
            #080704 35%,
            #000 75%
        );
    overflow:hidden;
}

/* =========================
   GOLDEN ATMOSPHERE
========================= */

.glow{
    position:absolute;
    left:50%;
    top:50%;
    width:55vw;
    height:55vw;
    max-width:750px;
    max-height:750px;

    transform:translate(-50%,-50%);

    background:radial-gradient(
        circle,
        rgba(255,210,90,.16),
        rgba(255,190,40,.06) 30%,
        transparent 70%
    );

    filter:blur(30px);

    animation:
        glowPulse 5s ease-in-out infinite;
}

@keyframes glowPulse{

    0%,100%{
        opacity:.35;
        transform:translate(-50%,-50%) scale(.9);
    }

    50%{
        opacity:.8;
        transform:translate(-50%,-50%) scale(1.15);
    }
}

/* =========================
   GOLDEN HORIZONTAL LIGHT
========================= */

.lightBeam{
    position:absolute;
    top:50%;
    left:-20%;

    width:140%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,220,120,.05),
        rgba(255,220,120,.8),
        rgba(255,220,120,.05),
        transparent
    );

    filter:blur(2px);

    opacity:0;

    animation:
        beamReveal 3.5s ease forwards;
}

@keyframes beamReveal{

    0%{
        opacity:0;
        transform:scaleX(0);
    }

    35%{
        opacity:1;
    }

    100%{
        opacity:.35;
        transform:scaleX(1);
    }
}

/* =========================
   LOGO CONTAINER
========================= */

.logoContainer{
    position:absolute;

    left:50%;
    top:50%;

    width:min(80vw,650px);

    transform:
        translate(-50%,-50%)
        scale(.55);

    opacity:0;

    filter:
        drop-shadow(0 0 0 rgba(255,210,90,0));

    animation:
        logoReveal 4s cubic-bezier(.16,1,.3,1) forwards;
}

.logoContainer img{
    display:block;

    width:100%;
    height:auto;

    object-fit:contain;

    /* removes the black square if your PNG has transparent background */
    mix-blend-mode:screen;
}

@keyframes logoReveal{

    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.55)
            rotateX(18deg);

        filter:
            blur(18px)
            brightness(.2);
    }

    35%{
        opacity:.25;
    }

    60%{
        opacity:.8;
        filter:
            blur(3px)
            brightness(1.3)
            drop-shadow(0 0 25px rgba(255,205,80,.35));
    }

    100%{
        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1)
            rotateX(0deg);

        filter:
            blur(0)
            brightness(1)
            drop-shadow(0 0 30px rgba(255,205,80,.2));
    }
}

/* =========================
   DIAMOND SPARKLE
========================= */

.sparkle{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:white;

    box-shadow:
        0 0 8px white,
        0 0 18px #ffe9a0,
        0 0 35px #ffd65c;

    opacity:0;

    animation:
        sparkleAnimation 3s ease-in-out infinite;
}

.sparkle::before,
.sparkle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    background:linear-gradient(
        transparent,
        white,
        transparent
    );
}

.sparkle::before{
    width:1px;
    height:45px;
}

.sparkle::after{
    width:45px;
    height:1px;
}

/* Different sparkle locations */

.s1{
    left:67%;
    top:37%;
    animation-delay:2s;
}

.s2{
    left:31%;
    top:52%;
    animation-delay:3.5s;
}

.s3{
    left:73%;
    top:58%;
    animation-delay:1.5s;
}

.s4{
    left:43%;
    top:33%;
    animation-delay:4s;
}

@keyframes sparkleAnimation{

    0%,70%,100%{
        opacity:0;
        transform:scale(.2) rotate(0deg);
    }

    75%{
        opacity:1;
        transform:scale(1.8) rotate(45deg);
    }

    85%{
        opacity:.2;
        transform:scale(.5) rotate(90deg);
    }
}

/* =========================
   FLOATING PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.particle{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#e8c66c;

    box-shadow:
        0 0 6px #d6b34d;

    opacity:.4;

    animation:
        floatParticle linear infinite;
}

@keyframes floatParticle{

    from{
        transform:
            translateY(110vh)
            translateX(0)
            scale(.5);

        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.4;
    }

    to{
        transform:
            translateY(-20vh)
            translateX(80px)
            scale(1.4);

        opacity:0;
    }
}

/* =========================
   CINEMATIC VIGNETTE
========================= */

.vignette{
    position:absolute;
    inset:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.35) 65%,
            rgba(0,0,0,.95) 100%
        );
}

/* =========================
   TOP & BOTTOM BLACK BARS
========================= */

.bar{
    position:absolute;
    left:0;

    width:100%;

    height:8vh;

    background:#000;

    z-index:20;

    animation:bars 2s ease forwards;
}

.topBar{
    top:0;
}

.bottomBar{
    bottom:0;
}

@keyframes bars{

    from{
        height:18vh;
    }

    to{
        height:6vh;
    }
}

/* =========================
   BRAND TEXT
========================= */

.brandText{
    position:absolute;

    left:50%;
    bottom:10%;

    transform:translateX(-50%);

    color:#d8b65a;

    letter-spacing:7px;

    font-size:11px;

    text-align:center;

    opacity:0;

    animation:
        textReveal 2s ease 2.7s forwards;
}

@keyframes textReveal{

    from{
        opacity:0;
        letter-spacing:15px;
    }

    to{
        opacity:.7;
        letter-spacing:7px;
    }
}

/* =========================
   LOADING LINE
========================= */

.loading{
    position:absolute;

    left:50%;
    bottom:6%;

    width:180px;
    height:1px;

    transform:translateX(-50%);

    background:rgba(255,255,255,.12);

    overflow:hidden;

    opacity:0;

    animation:
        loadingAppear 1s ease 1s forwards;
}

.loading::after{
    content:"";

    position:absolute;

    left:-100%;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e6c45f,
            transparent
        );

    animation:
        loadingMove 4s linear forwards;
}

@keyframes loadingAppear{
    to{
        opacity:1;
    }
}

@keyframes loadingMove{

    to{
        left:100%;
    }
}

/* =========================
   EXIT ANIMATION
========================= */

#intro.exit{

    animation:
        cinematicExit 1.5s cubic-bezier(.7,0,.3,1) forwards;
}

@keyframes cinematicExit{

    0%{
        opacity:1;
        transform:scale(1);
        filter:brightness(1);
    }

    60%{
        opacity:1;
        transform:scale(1.08);
        filter:brightness(1.5);
    }

    100%{
        opacity:0;
        transform:scale(1.18);
        filter:brightness(2.5);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .logoContainer{
        width:88vw;
    }

    .brandText{
        font-size:8px;
        letter-spacing:4px;
    }

    .loading{
        width:130px;
    }

}
</style>
</head>

<body>

<div id="intro">

    <!-- Ambient golden glow -->
    <div class="glow"></div>

    <!-- Cinematic light beam -->
    <div class="lightBeam"></div>

    <!-- Floating particles -->
    <div class="particles">

        <span class="particle" style="left:5%;animation-duration:8s"></span>
        <span class="particle" style="left:12%;animation-duration:12s;animation-delay:1s"></span>
        <span class="particle" style="left:18%;animation-duration:10s;animation-delay:3s"></span>
        <span class="particle" style="left:25%;animation-duration:14s;animation-delay:2s"></span>
        <span class="particle" style="left:33%;animation-duration:9s;animation-delay:4s"></span>
        <span class="particle" style="left:42%;animation-duration:13s;animation-delay:1s"></span>
        <span class="particle" style="left:50%;animation-duration:11s;animation-delay:5s"></span>
        <span class="particle" style="left:58%;animation-duration:15s;animation-delay:2s"></span>
        <span class="particle" style="left:65%;animation-duration:10s;animation-delay:4s"></span>
        <span class="particle" style="left:72%;animation-duration:13s;animation-delay:1s"></span>
        <span class="particle" style="left:80%;animation-duration:9s;animation-delay:3s"></span>
        <span class="particle" style="left:88%;animation-duration:14s;animation-delay:2s"></span>
        <span class="particle" style="left:95%;animation-duration:11s;animation-delay:5s"></span>

    </div>


    <!-- H.O. JEWELLERS LOGO -->

    <div class="logoContainer">
        <img src="ho-logo.png" alt="H.O. Jewellers">
    </div>


    <!-- Diamond-like sparkles -->

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>
    <div class="sparkle s4"></div>


    <!-- Cinematic vignette -->

    <div class="vignette"></div>


    <!-- Cinematic bars -->

    <div class="bar topBar"></div>
    <div class="bar bottomBar"></div>


    <!-- Brand text -->

    <div class="brandText">
        H . O .   J E W E L L E R S
    </div>


    <!-- Loading line -->

    <div class="loading"></div>

</div>


<script>

/* ==========================================
   AUTOMATIC REDIRECT
   ========================================== */

/*
   Change this to your actual webpage.

   Examples:

   "https://example.com"

   OR if another HTML page is in the same
   GitHub repository:

   "home.html"

   OR:

   "products.html"
*/

const NEXT_LINK = "Hp.html";


/* ==========================================
   INTRO DURATION
   ========================================== */

const INTRO_TIME = 6000;


/* ==========================================
   START REDIRECT
   ========================================== */

setTimeout(() => {

    const intro = document.getElementById("intro");

    /* Cinematic exit */

    intro.classList.add("exit");


    /* Wait for exit animation */

    setTimeout(() => {

        window.location.href = NEXT_LINK;

    },1500);

}, INTRO_TIME);

</script>

</body>
</html>
