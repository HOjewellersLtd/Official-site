<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>H.O. Jewellers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#intro{
position:fixed;inset:0;overflow:hidden;
background:radial-gradient(circle at 50% 47%,#171208 0%,#080704 30%,#000 72%);
opacity:0;transition:opacity .7s ease;
}
.glow{position:absolute;width:90vmin;height:90vmin;left:50%;top:48%;
transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle,rgba(255,210,90,.16),rgba(255,190,50,.05) 40%,transparent 72%);
filter:blur(25px);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(.9);opacity:.45}
50%{transform:translate(-50%,-50%) scale(1.12);opacity:.9}}
.beam{position:absolute;left:50%;top:50%;width:130vw;height:2px;
transform:translateX(-50%) scaleX(0);
background:linear-gradient(90deg,transparent,rgba(255,220,130,.8),transparent);
filter:blur(1px);animation:beam 3s 1s ease forwards}
@keyframes beam{to{transform:translateX(-50%) scaleX(1);opacity:.3}}
#logo{position:absolute;left:50%;top:48%;width:min(88vw,650px);
transform:translate(-50%,-50%) scale(.72);opacity:0;
animation:enter 3.5s cubic-bezier(.16,1,.3,1) .2s forwards}
#logo img{width:100%;display:block;filter:brightness(.2) blur(9px);
animation:focus 3.3s cubic-bezier(.16,1,.3,1) .4s forwards}
@keyframes enter{0%{opacity:0;transform:translate(-50%,-50%) scale(.72)}
40%{opacity:.25}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes focus{0%{filter:brightness(.15) blur(10px)}
65%{filter:brightness(1.3) blur(1px) drop-shadow(0 0 30px rgba(255,210,90,.35))}
100%{filter:brightness(1) blur(0) drop-shadow(0 0 22px rgba(255,205,80,.2))}}
.p{position:absolute;width:2px;height:2px;border-radius:50%;background:#d8b45a;
box-shadow:0 0 7px #d8b45a;opacity:0;animation:float linear infinite}
@keyframes float{0%{transform:translateY(110vh);opacity:0}15%{opacity:.7}
75%{opacity:.3}100%{transform:translateY(-20vh) translateX(60px);opacity:0}}
.s{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;
box-shadow:0 0 8px #fff,0 0 22px #ffe39a;opacity:0;animation:spark 3.5s ease-in-out infinite}
.s:before,.s:after{content:"";position:absolute;background:linear-gradient(transparent,#fff,transparent)}
.s:before{width:1px;height:44px;left:50%;top:50%;transform:translate(-50%,-50%)}
.s:after{width:44px;height:1px;left:50%;top:50%;transform:translate(-50%,-50%);
background:linear-gradient(90deg,transparent,#fff,transparent)}
@keyframes spark{0%,65%,100%{opacity:0;transform:scale(.2) rotate(0)}
72%{opacity:1;transform:scale(1.8) rotate(45deg)}84%{opacity:.15;transform:scale(.5)}}
.vignette{position:absolute;inset:0;pointer-events:none;
background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.35) 65%,rgba(0,0,0,.97) 100%)}
.bar{position:absolute;left:0;width:100%;height:5vh;background:#000;z-index:5}
.top{top:0}.bottom{bottom:0}
#loading{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
color:rgba(255,220,150,.65);font:9px Georgia;letter-spacing:4px;text-align:center}
#loading i{display:block;width:130px;height:1px;background:rgba(255,255,255,.12);margin-top:9px;overflow:hidden}
#loading i:after{content:"";display:block;width:45%;height:100%;background:#d7b45b;
animation:load 1.1s linear infinite}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(350%)}}
.exit{animation:exit 1.25s cubic-bezier(.7,0,.3,1) forwards}
@keyframes exit{55%{transform:scale(1.04);filter:brightness(1.3)}
100%{opacity:0;transform:scale(1.12);filter:brightness(2)}}
@media(max-width:600px){
#logo{width:96vw;top:47%}
.glow{width:125vw;height:125vw}
.bar{height:3.5vh}
#loading{bottom:8%}
}
</style>
</head>
